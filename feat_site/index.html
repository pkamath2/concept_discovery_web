<script>
(function () {
  var FILES = JSON.parse(document.getElementById('feat-data').textContent);
  var PAGE_SIZE = 48;
  var topN = 10;             // 5 | 10 | Infinity
  var scope = -1;          // -1 = all files, else file index
  var query = "";
  var shown = 0;
  var view = [];                          // current list of {feat, fileIdx}

  var grid = document.getElementById('grid');
  var countEl = document.getElementById('count');
  var loadBtn = document.getElementById('loadmore');
  var searchEl = document.getElementById('search');
  var fileSel = document.getElementById('fileselect');

  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  function hl(text){
    if(!query) return esc(text);
    var i = text.toLowerCase().indexOf(query);
    if(i < 0) return esc(text);
    return esc(text.slice(0,i)) + "<span class='mark'>" + esc(text.slice(i,i+query.length))
         + "</span>" + esc(text.slice(i+query.length));
  }

  function matches(feat){
    if(!query) return true;
    if(feat.id.toLowerCase().indexOf(query) >= 0) return true;
    for(var i=0;i<feat.concepts.length;i++){
      if(feat.concepts[i].label.toLowerCase().indexOf(query) >= 0) return true;
    }
    return false;
  }

  function barWidth(score, lo, hi){
    if(hi === lo) return 100;
    return Math.max(2, Math.round((score - lo) / (hi - lo) * 100));
  }

  function cardHTML(feat, fileIdx, expand){
    var cs = feat.concepts;
    var scores = cs.map(function(c){ return c.score; });
    var hi = scores.length ? Math.max.apply(null, scores) : 1;
    var lo = Math.min.apply(null, scores.concat([0]));   // honest zero baseline
    var limit = expand ? cs.length : Math.min(topN, cs.length);
    var rows = "";
    for(var i=0;i<limit;i++){
      var c = cs[i];
      var isTop = (c.score === hi);
      rows += "<div class='concept" + (isTop?" concept-top":"") + "'>"
            + "<div class='c-row'>"
            + "<button class='c-label' data-concept='" + esc(c.label) + "'>" + hl(c.label) + "</button>"
            + "<span class='c-score'>" + c.score.toFixed(2) + "</span>"
            + "</div>"
            + "<div class='bar'><span style='width:" + barWidth(c.score, lo, hi) + "%'></span></div>"
            + "</div>";
    }
    var chip = (scope === -1)
      ? "<button class='file-chip' data-file='" + fileIdx + "'>" + esc(FILES[fileIdx].label) + "</button>"
      : "";
    var more = (cs.length > limit)
      ? "<button class='card-more' data-expand data-file='" + fileIdx + "' data-id='" + esc(feat.id) + "'>+ "
        + (cs.length - limit) + " more</button>" : "";
    return "<div class='card' data-file='" + fileIdx + "' data-id='" + esc(feat.id) + "'>"
         + "<div class='card-head'><span class='feat-id'>" + hl(feat.id) + "</span>" + chip + "</div>"
         + "<div class='concepts'>" + rows + "</div>" + more + "</div>";
  }

  function buildView(){
    view = [];
    var idxs = (scope === -1) ? FILES.map(function(_,i){return i;}) : [scope];
    idxs.forEach(function(fi){
      FILES[fi].features.forEach(function(feat){
        if(matches(feat)) view.push({feat: feat, fileIdx: fi});
      });
    });
  }

  function render(reset){
    if(reset){ shown = 0; grid.innerHTML = ""; }
    if(shown === 0 && view.length === 0){
      grid.innerHTML = "<div class='empty'>Nothing matches &ldquo;" + esc(query) + "&rdquo;.</div>";
      loadBtn.hidden = true; countEl.textContent = "0 features"; return;
    }
    var slice = view.slice(shown, shown + PAGE_SIZE);
    var frag = document.createElement('div');
    frag.style.display = "contents";
    frag.innerHTML = slice.map(function(v){ return cardHTML(v.feat, v.fileIdx, false); }).join("");
    grid.appendChild(frag);
    shown += slice.length;
    loadBtn.hidden = shown >= view.length;
    var total = 0; ((scope===-1)?FILES:[FILES[scope]]).forEach(function(f){ total += f.features.length; });
    countEl.textContent = view.length + " / " + total + " features"
      + (scope === -1 ? " in " + FILES.length + " files" : "");
  }

  function refresh(){ buildView(); render(true); }

  grid.addEventListener('click', function(e){
    var exp = e.target.closest('[data-expand]');
    if(exp){
      var fi = parseInt(exp.getAttribute('data-file'),10);
      var id = exp.getAttribute('data-id');
      var feat = FILES[fi].features.find(function(f){ return f.id === id; });
      var card = exp.closest('.card');
      if(feat && card){ card.outerHTML = cardHTML(feat, fi, true); }
      return;
    }
    var chip = e.target.closest('.file-chip');
    if(chip){ fileSel.value = chip.getAttribute('data-file'); onFileChange(); return; }
    var cl = e.target.closest('[data-concept]');
    if(cl){ searchEl.value = cl.getAttribute('data-concept'); onSearch(true); }
  });

  var t;
  function onSearch(now){
    clearTimeout(t);
    var run = function(){ query = searchEl.value.trim().toLowerCase(); refresh(); };
    if(now){ run(); } else { t = setTimeout(run, 120); }
  }
  searchEl.addEventListener('input', function(){ onSearch(false); });

  function onFileChange(){
    var v = fileSel.value;
    scope = (v === "all") ? -1 : parseInt(v, 10);
    refresh();
  }
  fileSel.addEventListener('change', onFileChange);

  document.getElementById('topseg').addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    var v = b.getAttribute('data-top');
    topN = (v === 'all') ? Infinity : parseInt(v, 10);
    Array.prototype.forEach.call(this.children, function(c){ c.classList.remove('active'); });
    b.classList.add('active');
    render(true);
  });
  loadBtn.addEventListener('click', function(){ render(false); });

  // populate file selector
  (function(){
    var totalAll = 0; FILES.forEach(function(f){ totalAll += f.features.length; });
    var opts = "<option value='all'>All files (" + FILES.length + " files, " + totalAll + " features)</option>";
    FILES.forEach(function(f, i){
      opts += "<option value='" + i + "'>" + esc(f.label) + " (" + f.features.length + ")</option>";
    });
    fileSel.innerHTML = opts;
    fileSel.value = (scope === -1) ? "all" : String(scope);
  })();

  // initial active top button
  (function(){
    var want = (topN === Infinity) ? 'all' : String(topN);
    Array.prototype.forEach.call(document.querySelectorAll('#topseg button'), function(b){
      if(b.getAttribute('data-top') === want) b.classList.add('active');
    });
  })();

  refresh();
})();
</script>
